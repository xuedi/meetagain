framework:
    cache:
        app: cache.adapter.redis_tag_aware
        default_redis_provider: Redis
        system: cache.adapter.system

        pools:
            cache.cms_page_cache:
                adapter: cache.adapter.redis_tag_aware
                default_lifetime: 86400
            cache.app_state:
                adapter: cache.adapter.redis_tag_aware
            cache.config:
                adapter: cache.adapter.redis_tag_aware
            cache.image_alt_status:
                adapter: cache.adapter.redis_tag_aware
                default_lifetime: 86400
            cache.calendar_feed:
                adapter: cache.adapter.redis_tag_aware
                default_lifetime: 3600
            cache.sitemap:
                adapter: cache.adapter.redis_tag_aware
                default_lifetime: 21600
            cache.share_qr:
                adapter: cache.adapter.redis_tag_aware
                default_lifetime: 604800
            cache.image_attribution:
                adapter: cache.adapter.redis_tag_aware
                default_lifetime: 3600
