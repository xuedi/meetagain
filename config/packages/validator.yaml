framework:
    validation:
        # Match what Symfony\Component\Mime\Address accepts, so an address that passes a form
        # can always be used as a recipient. The html5 default allows "a..b@host", which Mime rejects.
        email_validation_mode: strict

        # Enables validator auto-mapping support.
        # For instance, basic validation constraints will be inferred from Doctrine's metadata.
        #auto_mapping:
        #    App\Entity\: []

when@test:
    framework:
        validation:
            not_compromised_password: false
