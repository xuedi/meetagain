controllers:
    type: attribute
    prefix: /{_locale}
    requirements:
        _locale: '[a-z]{2}'
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    exclude: ../src/Controller/NonLocale/

frontpage:
    type: attribute
    resource: ../src/Controller/NonLocale/FrontpageController.php

ajax:
    type: attribute
    resource: ../src/Controller/NonLocale/AjaxController.php

robots:
    type: attribute
    resource: ../src/Controller/NonLocale/RobotsController.php

site_logo:
    type: attribute
    resource: ../src/Controller/NonLocale/SiteLogoController.php

site_icon:
    type: attribute
    resource: ../src/Controller/NonLocale/SiteIconController.php

well_known:
    type: attribute
    resource: ../src/Controller/NonLocale/WellKnownController.php

sitemap:
    type: attribute
    resource: ../src/Controller/NonLocale/SitemapController.php

indexnow:
    type: attribute
    resource: ../src/Controller/NonLocale/IndexNowController.php
