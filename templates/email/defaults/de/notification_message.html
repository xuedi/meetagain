<h1>Hallo {{username}}!</h1>

<p>
    <strong>{{sender}}</strong> hat dir gerade eine Nachricht geschickt.
</p>
<p>
    Du kannst die Nachricht <a href="{{host}}/{{lang}}/profile/messages/{{senderId}}">hier</a> lesen.
</p>
<p>
    Wenn du diese Benachrichtigungen nicht mehr erhalten möchtest, kannst du
    sie in deinen <a href="{{host}}/{{lang}}/profile/config/">Einstellungen</a> deaktivieren.
</p>

<p>
    Viele Grüße,<br>
    {{greeting}}
</p>
