<h1>Du wurdest zu einer Supportanfrage hinzugezogen</h1>

<p>{{invitedBy}} hat die Administratoren gebeten, sich Supportanfrage #{{requestId}} anzusehen.</p>

<table>
    <tr>
        <td><strong>Anfragende Person:</strong></td>
        <td>{{name}}</td>
    </tr>
    <tr>
        <td><strong>Eingegangen:</strong></td>
        <td>{{createdAt}}</td>
    </tr>
</table>

<p><strong>Nachricht:</strong></p>
<p>{{message}}</p>

<p>
    Viele Grüße,<br>
    {{greeting}}
</p>
