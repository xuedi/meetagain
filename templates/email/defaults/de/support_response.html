<h1>Hallo {{name}}!</h1>

<p>Danke für deine Nachricht. Hier ist unsere Antwort:</p>

<p>{{response}}</p>

<hr>

<p><strong>Deine ursprüngliche Nachricht (eingegangen am {{createdAt}}):</strong></p>
<blockquote>{{originalMessage}}</blockquote>

<p>
    Deine Anfrage mit allen Antworten findest du hier, dort kannst du auch antworten:
    <a href="{{host}}/{{lang}}/contact/request/{{token}}">Anfrage öffnen</a>
</p>

<p>
    Viele Grüße,<br>
    {{greeting}}
</p>
