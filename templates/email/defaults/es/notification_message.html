<h1>¡Hola {{username}}!</h1>

<p>
    <strong>{{sender}}</strong> acaba de enviarte un mensaje
</p>
<p>
    Puedes leer el mensaje <a href="{{host}}/{{lang}}/profile/messages/{{senderId}}">aquí</a>.
</p>
<p>
    Si no quieres recibir esta notificación, puedes
    desactivarla en tus <a href="{{host}}/{{lang}}/profile/config/">ajustes</a>
</p>

<p>
    Saludos,<br>
    {{greeting}}
</p>
