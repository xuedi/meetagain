<h1>¡Hola {{username}}!</h1>

<p>
    <b>{{sender}}</b> acaba de enviarte un mensaje <br>
</p>
<p>
    Puedes leer el mensaje <a href="{{host}}/{{lang}}/profile/messages/{{senderId}}">aquí</a>.
</p>
<p>
    Si no quieres recibir esta notificación, puedes<br>
    desactivarla en tus <a href="{{host}}/{{lang}}/profile/config/">ajustes</a>
</p>

<p>
    Saludos,<br>
    {{greeting}}
</p>
