<h1>¡Hola {{username}}!</h1>

<p>
    <b>{{attendeeNames}}</b> planean asistir al evento <b>{{eventTitle}}</b><br>
    en <b>{{eventLocation}}</b> el <b>{{eventDate}}</b>.
</p>
<p>
    Puedes ver los detalles del evento <a href="{{host}}/{{lang}}/event/{{eventId}}">aquí</a>.
</p>
<p>
    Si no quieres recibir esta notificación, puedes<br>
    desactivarla en tus <a href="{{host}}/{{lang}}/profile/config/">ajustes</a>
</p>

<p>
    Saludos,<br>
    {{greeting}}
</p>
