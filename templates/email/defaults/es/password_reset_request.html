<h1>¡Hola {{username}}!</h1>

<p>
    Alguien (esperemos que tú) ha solicitado restablecer tu contraseña.
</p>
<p>
    Si no has sido tú, puedes ignorar este correo electrónico sin problema.
</p>
<p>
    Si has sido tú, haz clic en el siguiente enlace para continuar.
</p>

<p>
    <a href="{{host}}/{{lang}}/reset/verify/{{token}}">Restablece tu contraseña</a>
</p>

<p>
    Saludos,<br>
    {{greeting}}
</p>
