<h1>¡Hola {{username}}!</h1>

<p>
    Lamentamos informarte de que el evento <strong>{{eventTitle}}</strong>
    en <strong>{{eventLocation}}</strong> el <strong>{{eventDate}}</strong> ha sido <strong>cancelado</strong>.
</p>
<p>
    Aún puedes ver los detalles del evento <a href="{{host}}/{{lang}}/event/{{eventId}}">aquí</a>.
</p>
<p>
    Si no quieres recibir esta notificación, puedes
    desactivarla en tus <a href="{{host}}/{{lang}}/profile/config/">ajustes</a>
</p>

<p>
    Saludos,<br>
    {{greeting}}
</p>
