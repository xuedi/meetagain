<h1>¡Hola {{username}}!</h1>

<p>
    Lamentamos informarte de que el evento <b>{{eventTitle}}</b><br>
    en <b>{{eventLocation}}</b> el <b>{{eventDate}}</b> ha sido <b>cancelado</b>.
</p>
<p>
    Aún puedes ver los detalles del evento <a href="{{host}}/{{lang}}/event/{{eventId}}">aquí</a>.
</p>
<p>
    Si no quieres recibir esta notificación, puedes<br>
    desactivarla en tus <a href="{{host}}/{{lang}}/profile/config/">ajustes</a>
</p>

<p>
    Saludos,<br>
    {{greeting}}
</p>
