<h1>On te demande de rejoindre une demande de support</h1>

<p>{{invitedBy}} a demandé aux administrateurs d'examiner la demande de support #{{requestId}}.</p>

<table>
    <tr>
        <td><strong>Demandeur :</strong></td>
        <td>{{name}}</td>
    </tr>
    <tr>
        <td><strong>Envoyée le :</strong></td>
        <td>{{createdAt}}</td>
    </tr>
</table>

<p><strong>Message :</strong></p>
<p>{{message}}</p>

<p>
    À bientôt,<br>
    {{greeting}}
</p>
