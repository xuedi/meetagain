<table>
    <tr>
        <td><strong>Pour :</strong></td>
        <td>{{audience}}</td>
    </tr>
    <tr>
        <td><strong>Nom :</strong></td>
        <td>{{name}}</td>
    </tr>
    <tr>
        <td><strong>E-mail :</strong></td>

        <td><strong>Envoyée le :</strong></td>
        <td>{{createdAt}}</td>

</table>

<p><strong>Message :</strong></p>

<p>
    À bientôt,<br>
    {{greeting}}
</p>
