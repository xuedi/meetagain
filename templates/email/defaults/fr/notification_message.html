<h1>Bonjour {{username}} !</h1>

<p>
    <strong>{{sender}}</strong> vient de t'envoyer un message.
</p>
<p>
    Tu peux lire le message <a href="{{host}}/{{lang}}/profile/messages/{{senderId}}">ici</a>.
</p>
<p>
    Si tu ne souhaites plus recevoir cette notification, tu peux
    la désactiver dans tes <a href="{{host}}/{{lang}}/profile/config/">paramètres</a>
</p>

<p>
    À bientôt,<br>
    {{greeting}}
</p>
