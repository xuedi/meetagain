<h1>Bonjour {{username}} !</h1>

<p>
    L'événement <b>{{eventTitle}}</b>, auquel tu comptes participer, a été modifié :
</p>

{{changesHtml}}

<p>
    Tu peux consulter les détails de l'événement <a href="{{host}}/{{lang}}/event/{{eventId}}">ici</a>.
</p>
<p>
    Si tu ne souhaites plus recevoir cette notification, tu peux<br>
    la désactiver dans tes <a href="{{host}}/{{lang}}/profile/config/">paramètres</a>
</p>

<p>
    À bientôt,<br>
    {{greeting}}
</p>
