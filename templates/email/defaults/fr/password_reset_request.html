<h1>Bonjour {{username}} !</h1>

<p>
    Quelqu'un (toi, espérons-le) a demandé la réinitialisation de ton mot de passe.
</p>
<p>
    Si ce n'est pas toi, tu peux ignorer cet e-mail en toute sécurité.
</p>
<p>
    Si c'est bien toi, clique sur le lien ci-dessous pour continuer.
</p>

<p>
    <a href="{{host}}/{{lang}}/reset/verify/{{token}}">Réinitialiser ton mot de passe</a>
</p>

<p>
    À bientôt,<br>
    {{greeting}}
</p>
