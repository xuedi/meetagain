<h1>您好 {{username}}！</h1>

<p>
    温馨提醒，活动 <strong>{{eventTitle}}</strong> 将于今天举行，
    地点：<strong>{{eventLocation}}</strong>，时间：<strong>{{eventTime}}</strong>。
</p>
<p>
    您可以<a href="{{host}}/{{lang}}/event/{{eventId}}">点击这里</a>查看活动详情。
</p>
<p>
    如果您不想再收到活动提醒，可以在
    <a href="{{host}}/{{lang}}/profile/config/">通知设置</a>中关闭。
</p>
<p>
    祝好，<br>
    {{greeting}}
</p>
