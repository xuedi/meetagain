<h1>您好 {{username}}！</h1>

<p>
    很遗憾地通知您，活动 <strong>{{eventTitle}}</strong>
    （原定于 <strong>{{eventDate}}</strong> 在 <strong>{{eventLocation}}</strong> 举行）已被<strong>取消</strong>。
</p>
<p>
    您仍可以<a href="{{host}}/{{lang}}/event/{{eventId}}">点击这里</a>查看活动详情。
</p>
<p>
    如果您不想收到此类通知，可以在
    <a href="{{host}}/{{lang}}/profile/config/">设置</a>中关闭。
</p>

<p>
    祝好，<br>
    {{greeting}}
</p>
