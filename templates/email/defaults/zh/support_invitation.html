<h1>有人邀请您协助处理一条支持请求</h1>

<p>{{invitedBy}} 请管理员查看支持请求 #{{requestId}}。</p>

<table>
    <tr>
        <td><strong>提交人：</strong></td>
        <td>{{name}}</td>
    </tr>
    <tr>
        <td><strong>提交时间：</strong></td>
        <td>{{createdAt}}</td>
    </tr>
</table>

<p><strong>留言：</strong></p>
<p>{{message}}</p>

<p>
    祝好，<br>
    {{greeting}}
</p>
