# The Geo module's perimeter, pulled into core's run by `extends` in tests/config/mago.toml.
# Paths resolve against the project root. See modules/README.md, "How Mago Guard enforces it".

[analyzer]
excludes = ["modules/geo/tests/"]

[[guard.perimeter.restrictions]]
dependency = "Module\\Geo\\Internal\\**"
allow-from = ["Module\\Geo\\**"]

[[guard.perimeter.rules]]
namespace = "Module\\Geo\\"
permit = [
    "Module\\Geo\\**",
    "@global",                              # Collator, Override, PHP's own functions
    "Module\\Task\\Contract\\**",            # geo-refresh is a scheduled task, geo-import a Maintenance action
    "Doctrine\\**",
    "Symfony\\**",
    "Psr\\**",
]

# The module's tests reach what its code may, plus PHPUnit and the shared module test harness - no
# other core test helper, and no other core class unless listed here with its reason.
[[guard.perimeter.rules]]
namespace = "Module\\Geo\\Tests\\"
permit = [
    "Module\\Geo\\**",
    "@global",                              # Collator, Override, PHP's own functions
    "Module\\Task\\Contract\\**",            # geo-refresh is a scheduled task, geo-import a Maintenance action
    "PHPUnit\\**",
    "Tests\\Module\\**",                    # the shared module test harness: ModuleKernel
    "Doctrine\\**",
    "Symfony\\**",
    "Psr\\**",
]

[[guard.perimeter.rules]]
namespace = "ModuleGeoMigrations"
permit = ["**"]
