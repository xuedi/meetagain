    dataset_countries: 'Countries'
    dataset_states: 'States'
    dataset_cities: 'Cities'
    dataset_districts: 'Districts'
    dataset_translations: 'Translations'
    country_all: 'Every country'
    fact_countries: 'Countries'
    fact_states: 'States'
    fact_cities: 'Cities'
    fact_districts: 'Districts'
    fact_translations: 'City names'
    fact_countries_with_cities: 'Countries with cities'
    fact_countries_with_translations: 'Countries with translations'
