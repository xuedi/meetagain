# The Suggestion module's perimeter, pulled into core's run by `extends` in tests/config/mago.toml.
# Paths resolve against the project root. See modules/README.md, "How Mago Guard enforces it".

[analyzer]
excludes = ["modules/proposal/tests/"]

[[guard.perimeter.restrictions]]
dependency = "Module\\Proposal\\Internal\\**"
allow-from = ["Module\\Proposal\\**"]

[[guard.perimeter.rules]]
namespace = "Module\\Proposal\\"
permit = [
    "Module\\Proposal\\**",
    "@global",                                                               # DateTimeImmutable, Override, PHP's own functions
    "App\\Entity\\User",                                                     # the proposer and reviewer FKs - the one sanctioned core entity
    "App\\Controller\\AbstractController",                                   # module controllers extend core's, as plugin controllers do
    "App\\Activity\\ActivityService",                                        # every resolution lands in the activity log
    "App\\Activity\\MessageAbstract",                                        # the activity messages extend core's base
    "App\\Service\\Notification\\User\\ReviewNotificationProviderInterface", # pending suggestions and changes surface in core's review hub
    "App\\Service\\Notification\\User\\ReviewNotificationItem",              # that chain's item type
    "App\\Service\\Config\\PluginService",                                   # the registry drops providers of globally inactive plugins
    "App\\Emails\\EmailAbstract",                                            # the approved and rejected mails are core email types
    "App\\Emails\\MockSampleFactory",                                        # their preview samples
    "App\\Emails\\Guard\\Rule\\RecipientUserPresentRule",                    # the two recipient guards both mails declare
    "App\\Emails\\Guard\\Rule\\RecipientNotBlocklistedRule",                 # and the second of them
    "App\\ExtendedFilesystem",                                               # the template provider reads the default bodies from disk
    "App\\Service\\Config\\ConfigService",                                   # the mails' sender address
    "Module\\Email\\Contract\\**",                                           # mailer, blocklist and template seams
    "App\\Form\\BallotTermsType",                                             # the ballot-terms overlay of a field ballot, shared with the item and event ballots
    "Module\\Ballot\\Contract\\**",                                          # field ballots open, read and settle through the ballot module
    "Doctrine\\**",
    "Symfony\\**",
    "Twig\\**",
    "Psr\\**",
]

# The module's tests reach what its code may, plus PHPUnit and the shared module test harness - no
# other core test helper, and no other core class unless listed here with its reason.
[[guard.perimeter.rules]]
namespace = "Module\\Proposal\\Tests\\"
permit = [
    "Module\\Proposal\\**",
    "@global",                                                               # DateTimeImmutable, Override, PHP's own functions
    "App\\Entity\\User",                                                     # the proposer and reviewer FKs - the one sanctioned core entity
    "App\\Controller\\AbstractController",                                   # module controllers extend core's, as plugin controllers do
    "App\\Activity\\ActivityService",                                        # every resolution lands in the activity log
    "App\\Activity\\MessageAbstract",                                        # the activity messages extend core's base
    "App\\Service\\Notification\\User\\ReviewNotificationProviderInterface", # pending suggestions and changes surface in core's review hub
    "App\\Service\\Notification\\User\\ReviewNotificationItem",              # that chain's item type
    "App\\Service\\Config\\PluginService",                                   # the registry drops providers of globally inactive plugins
    "App\\Emails\\EmailAbstract",                                            # the approved and rejected mails are core email types
    "App\\Emails\\MockSampleFactory",                                        # their preview samples
    "App\\Emails\\Guard\\Rule\\RecipientUserPresentRule",                    # the two recipient guards both mails declare
    "App\\Emails\\Guard\\Rule\\RecipientNotBlocklistedRule",                 # and the second of them
    "App\\ExtendedFilesystem",                                               # the template provider reads the default bodies from disk
    "App\\Service\\Config\\ConfigService",                                   # the mails' sender address
    "Module\\Email\\Contract\\**",                                           # mailer, blocklist and template seams
    "App\\Form\\BallotTermsType",                                             # the ballot-terms overlay of a field ballot, shared with the item and event ballots
    "Module\\Ballot\\Contract\\**",                                          # field ballots open, read and settle through the ballot module
    "PHPUnit\\**",
    "Tests\\Module\\**",                                                     # the shared module test harness: ModuleKernel and Members
    "Doctrine\\**",
    "Symfony\\**",
    "Twig\\**",
    "Psr\\**",
]

[[guard.perimeter.rules]]
namespace = "ModuleSuggestionMigrations"
permit = ["**"]

[[guard.perimeter.rules]]
namespace = "ModuleProposalMigrations"
permit = ["**"]
