'An authentication exception occurred.': 'Se ha producido una excepción de autenticación.'
'Authentication credentials could not be found.': 'No se pudieron encontrar las credenciales de autenticación.'
'Authentication request could not be processed due to a system problem.': 'No se pudo procesar la solicitud de autenticación debido a un problema del sistema.'
'Invalid credentials.': 'Credenciales no válidas.'
'Cookie has already been used by someone else.': 'La cookie ya ha sido usada por otra persona.'
'Not privileged to request the resource.': 'Sin privilegios para solicitar el recurso.'
'Invalid CSRF token.': 'Token CSRF no válido.'
'No authentication provider found to support the authentication token.': 'No se encontró ningún proveedor de autenticación que admita el token de autenticación.'
'No session available, it either timed out or cookies are not enabled.': 'No hay sesión disponible, ha caducado o las cookies no están habilitadas.'
'No token could be found.': 'No se pudo encontrar ningún token.'
'Username could not be found.': 'No se pudo encontrar el nombre de usuario.'
'Account has expired.': 'La cuenta ha caducado.'
'Credentials have expired.': 'Las credenciales han caducado.'
'Account is disabled.': 'La cuenta está deshabilitada.'
'Account is locked.': 'La cuenta está bloqueada.'
