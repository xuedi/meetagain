'An authentication exception occurred.': 'Une erreur d''authentification s''est produite.'
'Authentication credentials could not be found.': 'Les identifiants d''authentification sont introuvables.'
'Authentication request could not be processed due to a system problem.': 'La demande d''authentification n''a pas pu être traitée en raison d''un problème système.'
'Invalid credentials.': 'Identifiants invalides.'
'Cookie has already been used by someone else.': 'Le cookie a déjà été utilisé par quelqu''un d''autre.'
'Not privileged to request the resource.': 'Tu n''as pas les droits nécessaires pour accéder à cette ressource.'
'Invalid CSRF token.': 'Jeton CSRF invalide.'
'No authentication provider found to support the authentication token.': 'Aucun fournisseur d''authentification trouvé pour prendre en charge le jeton d''authentification.'
'No session available, it either timed out or cookies are not enabled.': 'Aucune session disponible, soit elle a expiré, soit les cookies ne sont pas activés.'
'No token could be found.': 'Aucun jeton n''a pu être trouvé.'
'Username could not be found.': 'Le nom d''utilisateur est introuvable.'
'Account has expired.': 'Le compte a expiré.'
'Credentials have expired.': 'Les identifiants ont expiré.'
'Account is disabled.': 'Le compte est désactivé.'
'Account is locked.': 'Le compte est verrouillé.'
'Too many failed login attempts, please try again later.': 'Trop de tentatives de connexion échouées, réessaie plus tard.'
'Invalid or expired login link.': 'Lien de connexion invalide ou expiré.'
'Too many failed login attempts, please try again in %minutes% minute.': 'Trop de tentatives de connexion échouées, réessaie dans %minutes% minute.'
'Too many failed login attempts, please try again in %minutes% minutes.': 'Trop de tentatives de connexion échouées, réessaie dans %minutes% minutes.'
'security.account_status_registered': 'Confirme d''abord ton adresse e-mail. Nous t''avons envoyé un lien lors de ton inscription.'
'security.account_status_email_verified': 'Ton adresse e-mail est confirmée. Un administrateur doit encore activer ton compte.'
'security.account_status_blocked': 'Ce compte a été bloqué. Contacte le support si tu penses qu''il s''agit d''une erreur.'
'security.account_status_denied': 'Cette inscription a été refusée.'
'security.account_status_inactive': 'Ce compte ne peut pas être utilisé pour se connecter.'
