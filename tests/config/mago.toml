# Mago configuration for core.
#
# Covers every hand-written PHP file outside `plugins/`: `src/`, `tests/`, `modules/`, and the
# entry points and generated-adjacent corners that drifted uncovered for a long time - `bin/`,
# `config/`, `migrations/` and `public/`. Some of those are in `[source]` for the formatter only
# and are lifted out of the linter or analyzer below; each exclusion says why.
#
# Plugins are deliberately absent: each plugin owns a `tests/config/mago.toml` that this file never
# names, and `just checkMago` discovers them by glob. That keeps a commercial plugin's name out of
# the open-source tree, and gives every plugin its own run, so a rule one plugin relaxes stays
# relaxed for that plugin alone.
#
# For more information, see https://mago.carthage.software/#/getting-started/configuration
extends = ["mago-rules.toml"]

[source]
paths = [
    "bin/**/*.php",
    "config/**/*.php",
    "migrations/**/*.php",
    "modules/*/migrations/**/*.php",
    "modules/*/src/**/*.php",
    "modules/*/tests/**/*.php",
    "public/**/*.php",
    "src/",
    "tests/",
]
includes = ["vendor"]
# Generated files. `reference.php` says so in its own header, and the other three are Symfony Flex
# recipe files it rewrites when a bundle or importmap entry changes - formatting them is undone on
# the next `composer require`.
excludes = [
    "config/bundles.php",
    "config/importmap.php",
    "config/preload.php",
    "config/reference.php",
]

[linter]
# The standalone install wizard runs before composer's autoloader and the app's own classes exist,
# so it cannot follow the conventions the rest of the tree is linted against - it declares plain
# functions and uses `empty()` on form and $_SERVER keys that may be absent. It stays in `[source]`
# so the formatter still covers it; only the rule set is lifted.
excludes = ["public/install/"]

[analyzer]
# The analyzer produces PHPUnit false positives (createMock/createStub return MockObject&T, which
# mago reports as non-existent-method and invalid-callable); the linter already covers tests for
# style and structure. tests/stubs/ is intentionally NOT excluded, so extension stubs (e.g.
# Imagick) stay visible to the analyzer.
#
# `bin/` and `public/install/` are standalone entry points, each its own program at runtime. The
# analyzer reads them as one, so two scripts that both declare a `phpFilesIn()` helper collide as
# duplicate-definition; the check scripts also walk php-parser nodes whose concrete type cannot be
# narrowed statically. Both stay in `[source]`, so the formatter still covers them.
excludes = [
    "bin/",
    "modules/ballot/tests/",
    "modules/trust/tests/",
    "public/install/",
    "tests/Unit/",
    "tests/bootstrap.php",
]

# The module perimeter lives here, not in the shared rule file: it guards `modules/`, which only
# this config covers. tests/Unit/ModulePerimeterTest.php asserts these rules are present in this
# file, and a module added without an entry here is reported by that test, not by mago.
[guard]

# Inbound: nothing outside the module may reach past its Contract namespace.
#
# Restrictions AND together, so the generic backstop and the per-module entry both bind. The
# backstop closes the boundary against core, plugins and tests for every module, including one
# whose specific entry someone forgot to add; the two `*` in it do NOT correlate, so on its own it
# would still let one module reach into another's internals. The per-module entries below are what
# narrow it to the owning module. Both are needed - keep adding a specific entry per module.
[[guard.perimeter.restrictions]]
dependency = "Module\\*\\Internal\\**"
allow-from = ["Module\\*\\**"]

[[guard.perimeter.restrictions]]
dependency = "Module\\Trust\\Internal\\**"
allow-from = ["Module\\Trust\\**"]

[[guard.perimeter.restrictions]]
dependency = "Module\\Ballot\\Internal\\**"
allow-from = ["Module\\Ballot\\**"]

# Outbound: `[[guard.perimeter.rules]]` puts the whole project into allowlist mode, so every
# namespace below needs an entry or all of its dependencies are reported as unruled. The three
# `**` catch-alls state the current reality: core and plugins are not perimeter-guarded yet.
# The most specific matching rule wins, which is what makes the Trust entry bite.
[[guard.perimeter.rules]]
namespace = "@global"
permit = ["**"]

[[guard.perimeter.rules]]
namespace = "App\\"
permit = ["**"]

[[guard.perimeter.rules]]
namespace = "Plugin\\"
permit = ["**"]

[[guard.perimeter.rules]]
namespace = "Tests\\"
permit = ["**"]

# Migration namespaces, and the two Symfony config-builder namespaces `config/` files declare.
# They are listed for the same reason as the catch-alls above: `[[guard.perimeter.rules]]` puts
# the run into allowlist mode, so a namespace with no entry has every dependency reported.
[[guard.perimeter.rules]]
namespace = "AppMigrations"
permit = ["**"]

[[guard.perimeter.rules]]
namespace = "ModuleBallotMigrations"
permit = ["**"]

[[guard.perimeter.rules]]
namespace = "ModuleTrustMigrations"
permit = ["**"]

[[guard.perimeter.rules]]
namespace = "Symfony\\"
permit = ["**"]

[[guard.perimeter.rules]]
namespace = "Module\\Trust\\"
permit = [
    "Module\\Trust\\**",
    "@global",                              # DateTimeImmutable, Override, PHP's own functions
    "App\\Entity\\User",                    # the grant FK - the one sanctioned core entity
    "App\\Controller\\AbstractController",  # module controllers extend core's, as plugin controllers do
    "Doctrine\\**",
    "Symfony\\**",
    "Twig\\**",
    "Psr\\**",
]

# A module's own test suite is allowed the test toolchain and core fixture data; the perimeter
# it proves is the one on the production namespace above, not on itself.
[[guard.perimeter.rules]]
namespace = "Module\\Trust\\Tests\\"
permit = ["Module\\Trust\\**", "@global", "App\\**", "PHPUnit\\**", "Doctrine\\**", "Symfony\\**", "Psr\\**"]

[[guard.perimeter.rules]]
namespace = "Module\\Ballot\\"
permit = [
    "Module\\Ballot\\**",
    "@global",                                                  # DateTimeImmutable, Override, PHP's own functions
    "App\\Entity\\User",                                        # the vote FK - the one sanctioned core entity
    "App\\Controller\\AbstractController",                      # module controllers extend core's, as plugin controllers do
    "App\\CronTaskInterface",                                   # the deadline task registers on core's cron chain
    "App\\ValueObject\\CronTaskResult",                         # that chain's return type
    "App\\Enum\\CronTaskStatus",                                # that chain's status enum
    "App\\Service\\Notification\\User\\NotificationProviderInterface", # members hear about open ballots on core's bell
    "App\\Service\\Notification\\User\\NotificationItem",              # that chain's item type
    "Doctrine\\**",
    "Symfony\\**",
    "Twig\\**",
    "Psr\\**",
]

[[guard.perimeter.rules]]
namespace = "Module\\Ballot\\Tests\\"
permit = ["Module\\Ballot\\**", "@global", "App\\**", "PHPUnit\\**", "Doctrine\\**", "Symfony\\**", "Psr\\**"]

# Shape: the contract carries interfaces, enums and readonly value objects, nothing else.
[[guard.structural.rules]]
on = "Module\\*\\Contract\\**"
must-be = ["interface", "enum", "class"]

[[guard.structural.rules]]
on = "Module\\*\\Contract\\**"
target = "class"
must-be-final = true
must-be-readonly = true
