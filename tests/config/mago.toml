# Mago configuration for core.
#
# Covers every hand-written PHP file outside `plugins/`: `src/`, `tests/`, `modules/`, and the
# entry points and generated-adjacent corners that drifted uncovered for a long time - `bin/`,
# `config/`, `migrations/` and `public/`. Some of those are in `[source]` for the formatter only
# and are lifted out of the linter or analyzer below; each exclusion says why.
#
# Plugins are deliberately absent: each plugin owns a `tests/config/mago.toml` that this file never
# names, and `just checkMago` discovers them by glob. That keeps a commercial plugin's name out of
# the open-source tree, and gives every plugin its own run, so a rule one plugin relaxes stays
# relaxed for that plugin alone.
#
# For more information, see https://mago.carthage.software/#/getting-started/configuration

# Each module's perimeter - its restriction, its outbound permit list, its test and migration
# namespaces - lives in `modules/<name>/mago.toml` and joins this run through `extends`, which
# appends list entries rather than replacing them. They cannot run on their own the way plugin
# configs do: an inbound violation is reported on the file doing the reaching, which is outside the
# module, and one outbound rule puts the whole run into allowlist mode. `extends` takes no globs, so
# every module is listed; tests/Unit/ModulePerimeterTest.php fails if one is missing.
extends = [
    "mago-rules.toml",
    "../../modules/ballot/mago.toml",
    "../../modules/circulation/mago.toml",
    "../../modules/email/mago.toml",
    "../../modules/trust/mago.toml",
]

[source]
paths = [
    "bin/**/*.php",
    "config/**/*.php",
    "migrations/**/*.php",
    "modules/*/migrations/**/*.php",
    "modules/*/src/**/*.php",
    "modules/*/tests/**/*.php",
    "public/**/*.php",
    "src/",
    "tests/",
]
includes = ["vendor"]
# Generated files. `reference.php` says so in its own header, three more are Symfony Flex recipe
# files it rewrites when a bundle or importmap entry changes, and `plugins.php` is written by the
# installer and by every dev reset - formatting any of them is undone the next time it is written.
excludes = [
    "config/bundles.php",
    "config/importmap.php",
    "config/plugins.php",
    "config/preload.php",
    "config/reference.php",
]

[linter]
# The standalone install wizard runs before composer's autoloader and the app's own classes exist,
# so it cannot follow the conventions the rest of the tree is linted against - it declares plain
# functions and uses `empty()` on form and $_SERVER keys that may be absent. It stays in `[source]`
# so the formatter still covers it; only the rule set is lifted.
excludes = ["public/install/"]

[analyzer]
# The analyzer produces PHPUnit false positives (createMock/createStub return MockObject&T, which
# mago reports as non-existent-method and invalid-callable); the linter already covers tests for
# style and structure. tests/stubs/ is intentionally NOT excluded, so extension stubs (e.g.
# Imagick) stay visible to the analyzer.
#
# `bin/` and `public/install/` are standalone entry points, each its own program at runtime. The
# analyzer reads them as one, so two scripts that both declare a `phpFilesIn()` helper collide as
# duplicate-definition; the check scripts also walk php-parser nodes whose concrete type cannot be
# narrowed statically. Both stay in `[source]`, so the formatter still covers them.
excludes = [
    "bin/",
    "public/install/",
    "tests/Unit/",
    "tests/bootstrap.php",
]

# The module perimeter: the shared parts live here, each module's own entries in its `mago.toml`.
# The generic inbound backstop `Module\*\Internal\**` sits in mago-rules.toml, so plugin runs
# enforce it too; each module's own restriction narrows it to the owner.
[guard]

# Outbound: `[[guard.perimeter.rules]]` puts the whole project into allowlist mode, so every
# namespace below needs an entry or all of its dependencies are reported as unruled. The three
# `**` catch-alls state the current reality: core and plugins are not perimeter-guarded yet.
# The most specific matching rule wins, which is what makes a module entry bite.
[[guard.perimeter.rules]]
namespace = "@global"
permit = ["**"]

[[guard.perimeter.rules]]
namespace = "App\\"
permit = ["**"]

[[guard.perimeter.rules]]
namespace = "Plugin\\"
permit = ["**"]

[[guard.perimeter.rules]]
namespace = "Tests\\"
permit = ["**"]

# The core migration namespace, and the Symfony config-builder namespaces `config/` files
# declare. They are listed for the same reason as the catch-alls above: `[[guard.perimeter.rules]]` puts
# the run into allowlist mode, so a namespace with no entry has every dependency reported.
[[guard.perimeter.rules]]
namespace = "AppMigrations"
permit = ["**"]

[[guard.perimeter.rules]]
namespace = "Symfony\\"
permit = ["**"]

# Shape: the contract carries interfaces, enums and readonly value objects, nothing else.
[[guard.structural.rules]]
on = "Module\\*\\Contract\\**"
must-be = ["interface", "enum", "class"]

[[guard.structural.rules]]
on = "Module\\*\\Contract\\**"
target = "class"
must-be-final = true
must-be-readonly = true
