            class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
            decorates: remote.client
            arguments:
                - '@.inner'
                - ['127.0.0.0/8', '10.0.0.0/8', '192.168.0.0/16', '192.0.2.0/24', '198.51.100.0/24', '203.0.113.0/24', '172.16.0.0/13', '172.24.0.0/14', '172.28.0.0/15', '172.30.0.0/16', '172.31.0.0/17', '172.31.128.0/18', '172.31.192.0/19', '172.31.224.0/20', '172.31.240.0/21', '172.31.248.0/23', '172.31.251.0/24', '172.31.252.0/22', '169.254.0.0/16', '198.18.0.0/15', '0.0.0.0/8', '240.0.0.0/4', '100.64.0.0/10', '::1/128', 'fc00::/7', 'fe80::/10', '::ffff:0:0/96', '::/128', '::/96', '2002::/16', '2001::/32', '2001:db8::/32', '2001:0002::/48', '64:ff9b::/96', '64:ff9b:1::/48']
