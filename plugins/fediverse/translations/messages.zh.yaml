fediverse_config:
    page_title: '联邦宇宙'
    intro: '<p>把本站的公开活动分享到联邦宇宙 <a href="https://zh.wikipedia.org/wiki/%E8%81%94%E9%82%A6%E5%AE%87%E5%AE%99" target="_blank" rel="noopener" title="Wikipedia"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>，即 Mastodon <a href="https://joinmastodon.org" target="_blank" rel="noopener" title="joinmastodon.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>、Mobilizon <a href="https://mobilizon.org" target="_blank" rel="noopener" title="mobilizon.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a> 和 Gancio <a href="https://gancio.org" target="_blank" rel="noopener" title="gancio.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a> 背后的开放网络。</p><ul><li><strong>让更多人发现活动：</strong>这些网络上的任何人都可以关注该账号，在自己的动态中看到新活动，无需在这里注册。</li><li><strong>报名仍在这里：</strong>每个活动都链接回本站的活动页面，大家在那里报名。</li><li><strong>无需手动同步：</strong>新活动、修改和取消都会自动发出。</li><li><strong>只分享活动本身：</strong>活动的文字、时间和地点，勾选后还有活动图片 - 绝不包括成员数据，如报名、评论或成员照片。</li><li><strong>活动文字：</strong><em>仅标题</em> 只分享标题，<em>摘要</em> 分享导语或描述的开头，<em>完整描述</em> 分享全文。全文始终保留在这里的活动页面上。</li></ul>'
    content: '活动文字'
    content_help: '每个活动随附多少描述内容。完整文字始终保留在这里的活动页面上。'
    content_title: '仅标题'
    content_summary: '摘要'
    content_full: '完整描述'
    location: '地点'
    location_help: '分享场地信息的精确程度。'
    location_none: '不分享'
    location_city: '仅城市'
    location_address: '完整地址'
    image: '分享活动图片'
    username: '账号用户名'
    username_help: '小写字母、数字和下划线。一旦账号发布过内容或被关注，就不能再更改。'
    username_locked_help: '已锁定：账号已发布内容或已有关注者，更改名称会断开所有关注。'
    account_summary: '账号简介'
    account_summary_help: '显示在其他服务器上的账号资料中。'
    announce: '转发所有账号的活动'
    announce_help: '主账号会转发本安装中其他每个账号发布的活动，因此关注主账号就足够了。'
    blocked_servers: '已屏蔽的服务器'
    blocked_servers_help: '每行一个域名。来自这些服务器及其子域名的关注和请求都会被拒绝。'
    federation_heading: '分享到联邦宇宙'
    federation_yes: '是'
    federation_no: '否'
    federation_warning: '<p>开启期间，每个公开活动都会发布到其他服务器，那里的人可以查看、复制和转发。</p><ul><li><strong>更改需要时间：</strong>在这里编辑、取消或删除活动后，会通知其他服务器，但可能要过一段时间才会在那里显示。</li><li><strong>副本可能保留：</strong>会请求其他服务器删除已删除的活动，但它们可能会保留。</li><li><strong>关闭：</strong>账号立即消失，其活动会在下一次每日运行时从其他地方删除。此后其用户名不能再次使用。</li></ul>'
    stop_button: '停止联邦'
    stop_confirm: '请求所有服务器删除已共享的活动并停用所有账户？停用的用户名不能再次使用。请等到该按钮消失后再关闭插件。'
    flash_stopped: '正在停止联邦：所有用户名均已清空，接下来的几分钟内会请求其他服务器删除已共享的活动，并停用所有账户。请等到该按钮消失、并且“任务”页面上的投递任务显示没有剩余项目后，再关闭插件。'
    secretbox_label: '联邦宇宙账号密钥'
fediverse_object:
    canceled_notice: '本次活动已取消。'
