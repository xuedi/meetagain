fediverse_config:
    page_title: '联邦宇宙'
    intro: '<p>以一个可关注的独立账号，把本站的公开活动发布到联邦宇宙 - Mobilizon、Gancio、Mastodon。每一次参与都会引回这里的活动页面。</p><p>只有访客可以打开、搜索引擎可以收录的活动才会被分享，详细程度按本表单的选择。参与者名单、成员姓名和评论永远不会被分享。</p><p>整个安装的设置是上限：在其他地方选择的设置只能分享得更少，不能更多。</p><p>退出时会发送删除请求：当联邦停止或某个活动不再公开时，会请求其他服务器删除它们的副本。它们仍可能保留副本 - 删除只能尽力而为。</p><p>站点的某个部分关闭插件、清空其用户名或不再允许被收录时，就会退出联邦宇宙：其账号立即消失，其活动会在下一次每日运行时被删除。为整个安装关闭插件会立即停止一切，包括删除请求：请先使用整个安装设置页顶部的“停止联邦”。其删除请求会在接下来的几分钟内发出；请等到该按钮消失、并且“任务”页面上的投递任务显示没有剩余项目后，再关闭插件。</p>'
    content: '活动文字'
    content_help: '每个活动随附多少描述内容。完整文字始终保留在这里的活动页面上。'
    content_title: '仅标题'
    content_summary: '摘要'
    content_full: '完整描述'
    location: '地点'
    location_help: '分享场地信息的精确程度。'
    location_none: '不分享'
    location_city: '仅城市'
    location_address: '完整地址'
    image: '分享活动图片'
    username: '账号用户名'
    username_help: '小写字母、数字和下划线。设置之前不会分享任何内容；账号发布内容或有人关注后便无法更改。'
    username_locked_help: '已锁定：账号已发布内容或已有关注者，更改名称会断开所有关注。'
    account_summary: '账号简介'
    account_summary_help: '显示在其他服务器上的账号资料中。'
    announce: '转发所有账号的活动'
    announce_help: '主账号会转发本安装中其他每个账号发布的活动，因此关注主账号就足够了。'
    blocked_servers: '已屏蔽的服务器'
    blocked_servers_help: '每行一个域名。来自这些服务器及其子域名的关注和请求都会被拒绝。'
    stop_button: '停止联邦'
    stop_confirm: '请求所有服务器删除已共享的活动并停用所有账户？停用的用户名不能再次使用。'
    flash_stopped: '正在停止联邦：所有用户名均已清空，接下来的几分钟内会请求其他服务器删除已共享的活动，并停用所有账户。请等到该按钮消失、并且“任务”页面上的投递任务显示没有剩余项目后，再关闭插件。'
