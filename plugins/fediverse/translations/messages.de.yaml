fediverse_config:
    page_title: 'Fediverse'
    intro: '<p>Veröffentlicht die öffentlichen Events dieser Seite im Fediverse - Mobilizon, Gancio, Mastodon - unter einem eigenen Konto, dem man folgen kann. Jede Teilnahme führt zurück zur Eventseite hier.</p><p>Geteilt werden nur Events, die ein Gast öffnen und Suchmaschinen indexieren dürfen, mit dem in diesem Formular gewählten Detailgrad. Teilnehmerlisten, Mitgliedernamen und Kommentare werden nie geteilt.</p><p>Die Werte der gesamten Installation sind eine Obergrenze: Anderswo gewählte Einstellungen dürfen weniger teilen, nie mehr.</p><p>Beim Verlassen werden Löschungen verschickt: Endet die Föderation oder ist ein Event nicht mehr öffentlich, werden die anderen Server gebeten, ihre Kopien zu entfernen. Sie können sie trotzdem behalten - das Entfernen geschieht nach bestem Bemühen.</p><p>Schaltet ein Teil der Seite das Plugin ab, werden seine Events beim nächsten täglichen Lauf gelöscht. Wird das Plugin für die ganze Installation abgeschaltet, endet alles auf einmal, auch die Löschungen: Vorher oben in den installationsweiten Einstellungen Föderation beenden verwenden.</p>'
    content: 'Eventtext'
    content_help: 'Wie viel der Beschreibung mit jedem Event hinausgeht. Der volle Text bleibt immer auf der Eventseite hier.'
