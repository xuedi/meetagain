fediverse_config:
    page_title: 'Fediverse'
    intro: '<p>Teilt die öffentlichen Events dieser Seite im Fediverse <a href="https://de.wikipedia.org/wiki/Fediverse" target="_blank" rel="noopener" title="Wikipedia"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>, dem offenen Netzwerk hinter Mastodon <a href="https://joinmastodon.org" target="_blank" rel="noopener" title="joinmastodon.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>, Mobilizon <a href="https://mobilizon.org" target="_blank" rel="noopener" title="mobilizon.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a> und Gancio <a href="https://gancio.org" target="_blank" rel="noopener" title="gancio.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>.</p><ul><li><strong>Mehr Menschen finden die Events:</strong> Wer in diesen Netzwerken ist, kann dem Konto folgen und sieht neue Events in seinem Feed, ohne sich hier anzumelden.</li><li><strong>Die Teilnahme bleibt hier:</strong> Jedes Event verweist auf seine Seite hier, wo man sich anmeldet.</li><li><strong>Nichts nachzupflegen:</strong> Neue Events, Änderungen und Absagen gehen von selbst hinaus.</li><li><strong>Nur das Event:</strong> sein Text, Datum und Ort, und sein Bild, wenn du es ankreuzt - nie Mitgliederdaten wie Zusagen, Kommentare oder Fotos von Mitgliedern.</li><li><strong>Eventtext:</strong> <em>Nur der Titel</em> teilt nur den Titel, <em>Zusammenfassung</em> den Teaser oder den Anfang der Beschreibung, <em>Vollständige Beschreibung</em> den ganzen Text. Der ganze Text bleibt immer auf der Eventseite hier.</li></ul>'
    content: 'Eventtext'
    content_help: 'Wie viel der Beschreibung mit jedem Event hinausgeht. Der volle Text bleibt immer auf der Eventseite hier.'
    content_title: 'Nur der Titel'
    content_summary: 'Zusammenfassung'
    content_full: 'Vollständige Beschreibung'
    location: 'Ort'
    location_help: 'Wie genau der Veranstaltungsort geteilt wird.'
    location_none: 'Keiner'
    location_city: 'Nur die Stadt'
    location_address: 'Vollständige Adresse'
    image: 'Eventbild teilen'
    username: 'Benutzername des Kontos'
    username_help: 'Kleinbuchstaben, Ziffern und Unterstriche, etwa chess_club oder berlin_events. Er lässt sich nicht mehr ändern, sobald das Konto veröffentlicht hat oder ihm gefolgt wird.'
    username_locked_help: 'Gesperrt: Das Konto hat veröffentlicht oder hat Folgende, und ein geänderter Name würde jedes Folgen kappen.'
    account_summary: 'Kontobeschreibung'
    account_summary_help: 'Wird im Profil des Kontos auf anderen Servern angezeigt.'
    announce: 'Events aller Konten weiterleiten'
    announce_help: 'Das Hauptkonto teilt die Events, die jedes andere Konto dieser Installation veröffentlicht, sodass es genügt, ihm zu folgen.'
    blocked_servers: 'Gesperrte Server'
    blocked_servers_help: 'Eine Domain pro Zeile. Folgen und Anfragen dieser Server und ihrer Subdomains werden abgelehnt.'
    federation_heading: 'Im Fediverse teilen'
    federation_yes: 'Ja'
    federation_no: 'Nein'
    federation_warning: '<p>Solange dies an ist, wird jedes öffentliche Event an andere Server veröffentlicht, wo es gesehen, kopiert und weitergegeben werden kann.</p><ul><li><strong>Änderungen brauchen Zeit:</strong> Wird ein Event hier geändert, abgesagt oder gelöscht, erfahren die anderen Server davon, aber es kann eine Weile dauern, bis es dort sichtbar ist.</li><li><strong>Kopien können bleiben:</strong> Die anderen Server werden gebeten, gelöschte Events zu entfernen, können sie aber behalten.</li><li><strong>Abschalten:</strong> Das Konto verschwindet sofort, und seine Events werden beim nächsten täglichen Lauf anderswo gelöscht. Nach diesem Lauf kann sein Benutzername nicht mehr verwendet werden.</li></ul>'
    stop_button: 'Föderation beenden'
    stop_confirm: 'Alle Server bitten, die geteilten Events zu löschen, und jedes Konto stilllegen? Stillgelegte Benutzernamen können nicht erneut verwendet werden. Das Plugin erst abschalten, wenn diese Schaltfläche verschwunden ist.'
    flash_stopped: 'Föderation wird beendet: Jeder Benutzername ist geleert, und in den folgenden Minuten werden die anderen Server gebeten, die geteilten Events zu löschen, und jedes Konto wird stillgelegt. Das Plugin erst abschalten, wenn die Schaltfläche verschwunden ist und die Zustellungsaufgabe auf der Seite Aufgaben nichts Ausstehendes mehr meldet.'
    secretbox_label: 'Schlüssel der Fediverse-Konten'
fediverse_object:
    canceled_notice: 'Diese Veranstaltung wurde abgesagt.'
