fediverse_config:
    page_title: 'Fediverse'
    intro: '<p>Publishes the public events of this site to the fediverse - Mobilizon, Gancio, Mastodon - under a followable account of its own. Every participation leads back to the event page here.</p><p>Only events a guest may open and search engines may index are shared, with the detail chosen in this form. Attendee lists, member names and comments are never shared.</p><p>The installation-wide values are a ceiling: settings chosen anywhere else may share less, never more.</p><p>Leaving sends deletes: when federation stops or an event stops being public, the other servers are asked to remove their copies. They may keep them anyway - removal is best effort.</p><p>A part of the site that switches the plugin off, clears its username or can no longer be indexed leaves: its account disappears at once, and its events are deleted at the next daily run. Switching the plugin off for the whole installation stops everything at once, deletes included: use Stop federating at the top of the installation-wide settings first. Its deletes go out over the next minutes; switch the plugin off only once the Stop button is gone and the delivery task reports nothing remaining on the Tasks page.</p>'
    content: 'Event text'
    content_help: 'How much of the description goes out with each event. The full text always stays on the event page here.'
    content_title: 'Title only'
    content_summary: 'Summary'
    content_full: 'Full description'
    location: 'Location'
    location_help: 'How precisely the venue is shared.'
    location_none: 'None'
    location_city: 'City only'
    location_address: 'Full address'
    image: 'Share the event image'
    username: 'Account username'
    username_help: 'Lowercase letters, digits and underscores. Nothing is shared before one is set, and it cannot be changed once the account has published or been followed.'
    username_locked_help: 'Locked: the account has published or been followed, and a changed name would break every follow.'
    account_summary: 'Account description'
    account_summary_help: 'Shown on the account profile on other servers.'
    announce: 'Relay the events of every account'
    announce_help: 'The main account boosts the events every other account on this installation publishes, so following it is enough.'
    blocked_servers: 'Blocked servers'
    blocked_servers_help: 'One domain per line. Follows and requests from these servers, and their subdomains, are refused.'
    stop_button: 'Stop federating'
    stop_confirm: 'Ask every server to delete the shared events and retire every account? Retired usernames cannot be used again.'
    flash_stopped: 'Federation is stopping: every username is cleared, and over the next minutes the other servers are asked to delete the shared events and every account is retired. Switch the plugin off only once the Stop button is gone and the delivery task reports nothing remaining on the Tasks page.'
    secretbox_label: 'Fediverse account keys'
fediverse_object:
    canceled_notice: 'This event has been canceled.'
