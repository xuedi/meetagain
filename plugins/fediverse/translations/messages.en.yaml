fediverse_config:
    page_title: 'Fediverse'
    intro: '<p>Shares the public events of this site on the fediverse <a href="https://en.wikipedia.org/wiki/Fediverse" target="_blank" rel="noopener" title="Wikipedia"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>, the open network behind Mastodon <a href="https://joinmastodon.org" target="_blank" rel="noopener" title="joinmastodon.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>, Mobilizon <a href="https://mobilizon.org" target="_blank" rel="noopener" title="mobilizon.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a> and Gancio <a href="https://gancio.org" target="_blank" rel="noopener" title="gancio.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>.</p><ul><li><strong>More people find the events:</strong> anyone on those networks can follow the account and sees new events in their feed, without signing up here.</li><li><strong>Participation stays here:</strong> every event links back to its page on this site, where people sign up.</li><li><strong>Nothing to keep in sync:</strong> new events, edits and cancellations go out by themselves.</li><li><strong>Only the event:</strong> its text, date and place, and its image if you tick it - never member data such as RSVPs, comments or member photos.</li><li><strong>Event text:</strong> <em>Title only</em> shares just the title, <em>Summary</em> the teaser or the start of the description, <em>Full description</em> the whole text. The full text always stays on the event page here.</li></ul>'
    content: 'Event text'
    content_help: 'How much of the description goes out with each event. The full text always stays on the event page here.'
    content_title: 'Title only'
    content_summary: 'Summary'
    content_full: 'Full description'
    location: 'Location'
    location_help: 'How precisely the venue is shared.'
    location_none: 'None'
    location_city: 'City only'
    location_address: 'Full address'
    image: 'Share the event image'
    username: 'Account username'
    username_help: 'Lowercase letters, digits and underscores, such as chess_club or berlin_events. It cannot be changed once the account has published or been followed.'
    username_locked_help: 'Locked: the account has published or been followed, and a changed name would break every follow.'
    account_summary: 'Account description'
    account_summary_help: 'Shown on the account profile on other servers.'
    announce: 'Relay the events of every account'
    announce_help: 'The main account boosts the events every other account on this installation publishes, so following it is enough.'
    blocked_servers: 'Blocked servers'
    blocked_servers_help: 'One domain per line. Follows and requests from these servers, and their subdomains, are refused.'
    federation_heading: 'Share on the fediverse'
    federation_yes: 'Yes'
    federation_no: 'No'
    federation_warning: '<p>While this is on, every public event is published to other servers, where people can see, copy and pass it on.</p><ul><li><strong>Changes take time:</strong> when an event is edited, cancelled or deleted here, the other servers are told, but it can take a while until it shows there.</li><li><strong>Copies may stay:</strong> the other servers are asked to remove deleted events, but they may keep them.</li><li><strong>Switching off:</strong> the account disappears at once, and its events are deleted elsewhere at the next daily run. After that run its username cannot be used again.</li></ul>'
    stop_button: 'Stop federating'
    stop_confirm: 'Ask every server to delete the shared events and retire every account? Retired usernames cannot be used again. Switch the plugin off only once this button is gone.'
    flash_stopped: 'Federation is stopping: every username is cleared, and over the next minutes the other servers are asked to delete the shared events and every account is retired. Switch the plugin off only once the Stop button is gone and the delivery task reports nothing remaining on the Tasks page.'
    secretbox_label: 'Fediverse account keys'
fediverse_object:
    canceled_notice: 'This event has been canceled.'
