fediverse_config:
    page_title: 'Fediverse'
    intro: '<p>Publie les événements publics de ce site dans le fediverse - Mobilizon, Gancio, Mastodon - sous un compte propre que l''on peut suivre. Chaque participation ramène à la page de l''événement ici.</p><p>Seuls les événements qu''un visiteur peut ouvrir et que les moteurs de recherche peuvent indexer sont partagés, avec le niveau de détail choisi dans ce formulaire. Les listes de participants, les noms des membres et les commentaires ne sont jamais partagés.</p><p>Les valeurs de l''installation entière sont un plafond : les réglages choisis ailleurs peuvent partager moins, jamais plus.</p><p>Partir envoie des suppressions : quand la fédération s''arrête ou qu''un événement cesse d''être public, les autres serveurs sont priés de retirer leurs copies. Ils peuvent les garder malgré tout - le retrait se fait au mieux.</p><p>Une partie du site qui désactive le plugin, vide son nom d''utilisateur ou ne peut plus être indexée quitte le fediverse : son compte disparaît aussitôt et ses événements sont supprimés lors du prochain passage quotidien. Désactiver le plugin pour toute l''installation arrête tout d''un coup, suppressions comprises : utilisez d''abord Arrêter la fédération en haut des réglages de l''installation. Ses suppressions partent dans les minutes qui suivent ; ne désactivez le plugin qu''une fois le bouton disparu et lorsque la tâche de livraison n''indique plus rien en attente sur la page Tâches.</p>'
    content: 'Texte de l''événement'
    content_help: 'La part de la description envoyée avec chaque événement. Le texte complet reste toujours sur la page de l''événement ici.'
    content_title: 'Titre seulement'
    content_summary: 'Résumé'
    content_full: 'Description complète'
    location: 'Lieu'
    location_help: 'La précision avec laquelle le lieu est partagé.'
    location_none: 'Aucun'
    location_city: 'Ville seulement'
    location_address: 'Adresse complète'
    image: 'Partager l''image de l''événement'
    username: 'Nom d''utilisateur du compte'
    username_help: 'Lettres minuscules, chiffres et tirets bas. Rien n''est partagé tant qu''il n''est pas défini, et il ne peut plus être modifié une fois que le compte a publié ou a des abonnés.'
    username_locked_help: 'Verrouillé : le compte a publié ou a des abonnés, et un nom modifié romprait chaque abonnement.'
    account_summary: 'Description du compte'
    account_summary_help: 'Affichée sur le profil du compte sur les autres serveurs.'
    announce: 'Relayer les événements de tous les comptes'
    announce_help: 'Le compte principal partage les événements publiés par chaque autre compte de cette installation ; le suivre suffit donc.'
    blocked_servers: 'Serveurs bloqués'
    blocked_servers_help: 'Un domaine par ligne. Les abonnements et requêtes de ces serveurs et de leurs sous-domaines sont refusés.'
    stop_button: 'Arrêter la fédération'
    stop_confirm: 'Demander à chaque serveur de supprimer les événements partagés et retirer chaque compte ? Les noms d''utilisateur retirés ne peuvent plus être réutilisés.'
    flash_stopped: 'La fédération s''arrête : chaque nom d''utilisateur est vidé et, dans les minutes qui suivent, les autres serveurs sont priés de supprimer les événements partagés et chaque compte est retiré. Ne désactivez le plugin qu''une fois le bouton disparu et lorsque la tâche de livraison n''indique plus rien en attente sur la page Tâches.'
    secretbox_label: 'Clés des comptes du fediverse'
