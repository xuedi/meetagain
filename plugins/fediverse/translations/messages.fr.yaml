fediverse_config:
    page_title: 'Fediverse'
    intro: '<p>Partage les événements publics de ce site dans le fediverse <a href="https://fr.wikipedia.org/wiki/Fediverse" target="_blank" rel="noopener" title="Wikipedia"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>, le réseau ouvert derrière Mastodon <a href="https://joinmastodon.org" target="_blank" rel="noopener" title="joinmastodon.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>, Mobilizon <a href="https://mobilizon.org" target="_blank" rel="noopener" title="mobilizon.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a> et Gancio <a href="https://gancio.org" target="_blank" rel="noopener" title="gancio.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>.</p><ul><li><strong>Plus de monde trouve les événements :</strong> sur ces réseaux, chacun peut suivre le compte et voit les nouveaux événements dans son fil, sans s''inscrire ici.</li><li><strong>La participation reste ici :</strong> chaque événement renvoie à sa page sur ce site, où l''on s''inscrit.</li><li><strong>Rien à synchroniser :</strong> les nouveaux événements, les modifications et les annulations partent d''eux-mêmes.</li><li><strong>Seulement l''événement :</strong> son texte, sa date et son lieu, et son image si vous la cochez - jamais les données des membres comme les inscriptions, les commentaires ou les photos des membres.</li><li><strong>Texte de l''événement :</strong> <em>Titre seulement</em> partage uniquement le titre, <em>Résumé</em> l''accroche ou le début de la description, <em>Description complète</em> le texte entier. Le texte complet reste toujours sur la page de l''événement ici.</li></ul>'
    content: 'Texte de l''événement'
    content_help: 'La part de la description envoyée avec chaque événement. Le texte complet reste toujours sur la page de l''événement ici.'
    content_title: 'Titre seulement'
    content_summary: 'Résumé'
    content_full: 'Description complète'
    location: 'Lieu'
    location_help: 'La précision avec laquelle le lieu est partagé.'
    location_none: 'Aucun'
    location_city: 'Ville seulement'
    location_address: 'Adresse complète'
    image: 'Partager l''image de l''événement'
    username: 'Nom d''utilisateur du compte'
    username_help: 'Lettres minuscules, chiffres et tirets bas. Il ne peut plus être modifié une fois que le compte a publié ou est suivi.'
    username_locked_help: 'Verrouillé : le compte a publié ou a des abonnés, et un nom modifié romprait chaque abonnement.'
    account_summary: 'Description du compte'
    account_summary_help: 'Affichée sur le profil du compte sur les autres serveurs.'
    announce: 'Relayer les événements de tous les comptes'
    announce_help: 'Le compte principal partage les événements publiés par chaque autre compte de cette installation ; le suivre suffit donc.'
    blocked_servers: 'Serveurs bloqués'
    blocked_servers_help: 'Un domaine par ligne. Les abonnements et requêtes de ces serveurs et de leurs sous-domaines sont refusés.'
    federation_heading: 'Partager dans le fediverse'
    federation_yes: 'Oui'
    federation_no: 'Non'
    federation_warning: '<p>Tant que c''est activé, chaque événement public est publié sur d''autres serveurs, où il peut être vu, copié et relayé.</p><ul><li><strong>Les changements prennent du temps :</strong> quand un événement est modifié, annulé ou supprimé ici, les autres serveurs sont prévenus, mais cela peut mettre un moment à s''y afficher.</li><li><strong>Des copies peuvent rester :</strong> les autres serveurs sont priés de retirer les événements supprimés, mais peuvent les garder.</li><li><strong>Désactiver :</strong> le compte disparaît aussitôt, et ses événements sont supprimés ailleurs lors du prochain passage quotidien. Après ce passage, son nom d''utilisateur ne peut plus être réutilisé.</li></ul>'
    stop_button: 'Arrêter la fédération'
    stop_confirm: 'Demander à chaque serveur de supprimer les événements partagés et retirer chaque compte ? Les noms d''utilisateur retirés ne peuvent plus être réutilisés. Ne désactivez le plugin qu''une fois ce bouton disparu.'
    flash_stopped: 'La fédération s''arrête : chaque nom d''utilisateur est vidé et, dans les minutes qui suivent, les autres serveurs sont priés de supprimer les événements partagés et chaque compte est retiré. Ne désactivez le plugin qu''une fois le bouton disparu et lorsque la tâche de livraison n''indique plus rien en attente sur la page Tâches.'
    secretbox_label: 'Clés des comptes du fediverse'
fediverse_object:
    canceled_notice: 'Cet événement a été annulé.'
