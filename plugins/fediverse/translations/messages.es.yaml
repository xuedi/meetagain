fediverse_config:
    page_title: 'Fediverso'
    intro: '<p>Publica los eventos públicos de este sitio en el fediverso - Mobilizon, Gancio, Mastodon - con una cuenta propia que se puede seguir. Cada participación lleva de vuelta a la página del evento aquí.</p><p>Solo se comparten los eventos que un visitante puede abrir y los buscadores pueden indexar, con el nivel de detalle elegido en este formulario. Las listas de asistentes, los nombres de los miembros y los comentarios nunca se comparten.</p><p>Los valores de toda la instalación son un límite: los ajustes elegidos en otro lugar pueden compartir menos, nunca más.</p><p>Salir envía borrados: cuando la federación se detiene o un evento deja de ser público, se pide a los demás servidores que eliminen sus copias. Pueden conservarlas de todos modos - la eliminación es la mejor posible, no una garantía.</p><p>Una parte del sitio que desactiva el plugin ve sus eventos borrados en la siguiente ejecución diaria. Desactivar el plugin para toda la instalación lo detiene todo de una vez, borrados incluidos: usa primero Dejar de federar arriba en los ajustes de la instalación.</p>'
    content: 'Texto del evento'
    content_help: 'Cuánto de la descripción sale con cada evento. El texto completo siempre se queda en la página del evento aquí.'
    content_title: 'Solo el título'
    content_summary: 'Resumen'
    content_full: 'Descripción completa'
    location: 'Ubicación'
    location_help: 'Con qué precisión se comparte el lugar.'
    location_none: 'Ninguna'
    location_city: 'Solo la ciudad'
    location_address: 'Dirección completa'
    image: 'Compartir la imagen del evento'
    username: 'Nombre de usuario de la cuenta'
    username_help: 'Letras minúsculas, dígitos y guiones bajos. No se comparte nada hasta que se defina, y no se puede cambiar una vez que la cuenta ha publicado o tiene seguidores.'
    username_locked_help: 'Bloqueado: la cuenta ya ha publicado o tiene seguidores, y un nombre cambiado rompería cada seguimiento.'
    account_summary: 'Descripción de la cuenta'
    account_summary_help: 'Se muestra en el perfil de la cuenta en otros servidores.'
    announce: 'Difundir los eventos de todas las cuentas'
    announce_help: 'La cuenta principal comparte los eventos que publica cada una de las demás cuentas de esta instalación, así que basta con seguirla.'
    blocked_servers: 'Servidores bloqueados'
    blocked_servers_help: 'Un dominio por línea. Se rechazan los seguimientos y las peticiones de estos servidores y de sus subdominios.'
    stop_button: 'Dejar de federar'
    stop_confirm: '¿Pedir a cada servidor que borre los eventos compartidos y retirar cada cuenta? Los nombres de usuario retirados no se pueden volver a usar.'
    flash_stopped: 'Federación detenida: se pide a los demás servidores que borren los eventos compartidos, y cada cuenta queda retirada.'
    secretbox_label: 'Claves de las cuentas del fediverso'
