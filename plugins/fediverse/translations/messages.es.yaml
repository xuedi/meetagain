fediverse_config:
    page_title: 'Fediverso'
    intro: '<p>Comparte los eventos públicos de este sitio en el fediverso <a href="https://es.wikipedia.org/wiki/Fediverso" target="_blank" rel="noopener" title="Wikipedia"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>, la red abierta detrás de Mastodon <a href="https://joinmastodon.org" target="_blank" rel="noopener" title="joinmastodon.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>, Mobilizon <a href="https://mobilizon.org" target="_blank" rel="noopener" title="mobilizon.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a> y Gancio <a href="https://gancio.org" target="_blank" rel="noopener" title="gancio.org"><span class="icon is-small"><i class="fa fa-circle-info"></i></span></a>.</p><ul><li><strong>Más personas encuentran los eventos:</strong> cualquiera en esas redes puede seguir la cuenta y ve los eventos nuevos en su feed, sin registrarse aquí.</li><li><strong>La participación se queda aquí:</strong> cada evento enlaza con su página en este sitio, donde la gente se apunta.</li><li><strong>Nada que sincronizar:</strong> los eventos nuevos, los cambios y las cancelaciones salen solos.</li><li><strong>Solo el evento:</strong> su texto, fecha y lugar, y su imagen si la marcas - nunca datos de miembros como confirmaciones de asistencia, comentarios o fotos de miembros.</li><li><strong>Texto del evento:</strong> <em>Solo el título</em> comparte solo el título, <em>Resumen</em> la entradilla o el comienzo de la descripción, <em>Descripción completa</em> el texto entero. El texto completo siempre se queda en la página del evento aquí.</li></ul>'
    content: 'Texto del evento'
    content_help: 'Cuánto de la descripción sale con cada evento. El texto completo siempre se queda en la página del evento aquí.'
    content_title: 'Solo el título'
    content_summary: 'Resumen'
    content_full: 'Descripción completa'
    location: 'Ubicación'
    location_help: 'Con qué precisión se comparte el lugar.'
    location_none: 'Ninguna'
    location_city: 'Solo la ciudad'
    location_address: 'Dirección completa'
    image: 'Compartir la imagen del evento'
    username: 'Nombre de usuario de la cuenta'
    username_help: 'Letras minúsculas, dígitos y guiones bajos, por ejemplo chess_club o berlin_events. No se puede cambiar una vez que la cuenta ha publicado o tiene seguidores.'
    username_locked_help: 'Bloqueado: la cuenta ya ha publicado o tiene seguidores, y un nombre cambiado rompería cada seguimiento.'
    account_summary: 'Descripción de la cuenta'
    account_summary_help: 'Se muestra en el perfil de la cuenta en otros servidores.'
    announce: 'Difundir los eventos de todas las cuentas'
    announce_help: 'La cuenta principal comparte los eventos que publica cada una de las demás cuentas de esta instalación, así que basta con seguirla.'
    blocked_servers: 'Servidores bloqueados'
    blocked_servers_help: 'Un dominio por línea. Se rechazan los seguimientos y las peticiones de estos servidores y de sus subdominios.'
    federation_heading: 'Compartir en el fediverso'
    federation_yes: 'Sí'
    federation_no: 'No'
    federation_warning: '<p>Mientras esté activado, cada evento público se publica en otros servidores, donde se puede ver, copiar y difundir.</p><ul><li><strong>Los cambios tardan:</strong> cuando un evento se edita, se cancela o se borra aquí, se avisa a los demás servidores, pero puede tardar un tiempo en verse allí.</li><li><strong>Las copias pueden quedarse:</strong> se pide a los demás servidores que eliminen los eventos borrados, pero pueden conservarlos.</li><li><strong>Desactivar:</strong> la cuenta desaparece de inmediato y sus eventos se borran en otros servidores en la siguiente ejecución diaria. Después de esa ejecución su nombre de usuario ya no se puede usar.</li></ul>'
    stop_button: 'Dejar de federar'
    stop_confirm: '¿Pedir a cada servidor que borre los eventos compartidos y retirar cada cuenta? Los nombres de usuario retirados no se pueden volver a usar. Desactiva el plugin solo cuando este botón haya desaparecido.'
    flash_stopped: 'La federación se está deteniendo: se vacían todos los nombres de usuario y, durante los minutos siguientes, se pide a los demás servidores que borren los eventos compartidos y cada cuenta queda retirada. Desactiva el plugin solo cuando el botón haya desaparecido y la tarea de entrega no indique nada pendiente en la página Tareas.'
    secretbox_label: 'Claves de las cuentas del fediverso'
fediverse_object:
    canceled_notice: 'Este evento ha sido cancelado.'
