services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $kernelProjectDir: '%kernel.project_dir%'

    Plugin\Films\:
        resource: '../src/'
        exclude:
            - '../src/DataFixtures/'

# Fixtures are dev and test artefacts: registering them in the production container
# would make every service they inject a production dependency.
when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        Plugin\Films\DataFixtures\:
            resource: '../src/DataFixtures/'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        Plugin\Films\DataFixtures\:
            resource: '../src/DataFixtures/'
