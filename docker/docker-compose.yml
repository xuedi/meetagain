services:

  # Main PHP application server (FrankenPHP with Caddy)
  php:
    build: php
    container_name: "ma-php"
    user: ${HOST_UID}:${HOST_GID}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/favicon.ico"]
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
      - "443:443/udp" # HTTP/3
    volumes:
      - ../:/var/www/html/
      - ./php/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./certs:/certs:ro
      - ma-caddy_data:/data
      - ma-caddy_config:/config
    environment:
      - UID=${HOST_UID}
      - GID=${HOST_GID}
      - USERNAME=${HOST_USERNAME}
      - REDIS_URL=redis://valkey:6379
      - STORAGE_DSN=s3://GK6d656574616761696e646576:4469dab6ad31edf40ec5e2dafc7f9aec9c6e0a1a4394bf42d557483570d2b4b3@garage:3900/meetagain?region=garage&tls=false&web=garage:3902
      - MEETAGAIN_THUMBNAILS_UPSTREAM=garage:3902
      - MEETAGAIN_THUMBNAILS_HOST=meetagain-thumbnails
    depends_on:
      - valkey
      - garage
    tty: true

  # Message worker: handles what requests and schedules hand to the async transport
  worker:
    build: php
    container_name: "ma-worker"
    user: ${HOST_UID}:${HOST_GID}
    healthcheck:
      disable: true
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=60", "--memory-limit=256M"]
    restart: unless-stopped
    volumes:
      - ../:/var/www/html/
    environment:
      - UID=${HOST_UID}
      - GID=${HOST_GID}
      - USERNAME=${HOST_USERNAME}
      - REDIS_URL=redis://valkey:6379
      - STORAGE_DSN=s3://GK6d656574616761696e646576:4469dab6ad31edf40ec5e2dafc7f9aec9c6e0a1a4394bf42d557483570d2b4b3@garage:3900/meetagain?region=garage&tls=false&web=garage:3902
      - XDEBUG_MODE=off
    depends_on:
      - mariadb
      - valkey
      - garage

  # Scheduler: triggers every task on its cadence
  scheduler:
    build: php
    container_name: "ma-scheduler"
    user: ${HOST_UID}:${HOST_GID}
    healthcheck:
      disable: true
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "--time-limit=60", "--memory-limit=256M"]
    restart: unless-stopped
    volumes:
      - ../:/var/www/html/
    environment:
      - UID=${HOST_UID}
      - GID=${HOST_GID}
      - USERNAME=${HOST_USERNAME}
      - REDIS_URL=redis://valkey:6379
      - STORAGE_DSN=s3://GK6d656574616761696e646576:4469dab6ad31edf40ec5e2dafc7f9aec9c6e0a1a4394bf42d557483570d2b4b3@garage:3900/meetagain?region=garage&tls=false&web=garage:3902
      - XDEBUG_MODE=off
    depends_on:
      - mariadb
      - valkey
      - garage

  # S3 storage for images, thumbnails and private files (prepared by: just storageInit)
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    container_name: "ma-garage"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ma-garage-meta:/var/lib/garage/meta
      - ma-garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3902:3902"

  # Database server
  mariadb:
    image: mariadb:13.0.2@sha256:f1bba652ba57bea3099ca2fe1af692af537c27d96e0bcde39dce29e2ba1ec4f3
    container_name: "ma-db"
    volumes:
      - ma-mysql-data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 8g
    memswap_limit: 8g
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_HOST=${MARIADB_HOST}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}

  # Mail catcher for development (UI at localhost:8025)
  mailpit:
    container_name: "ma-mailpit"
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    user: ${HOST_UID}:${HOST_GID}
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      - MP_MAX_MESSAGES=0

  # Redis-compatible cache server
  valkey:
    container_name: "ma-valkey"
    image: valkey/valkey:9.2@sha256:247b5e730bdc9dc29fddb8274d1731b203a1a1a46af63eae3a9d55b4bf74853f
    command: valkey-server --save 60 1 --loglevel warning
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - ma-valkey-data:/data

  # Accessibility testing tool (run via: just checkA11y)
  pa11y:
    build: pa11y
    container_name: "ma-pa11y"
    network_mode: "host"

  # PHP server in prod mode for benchmarking (run via: just testPerformance)
  php-bench:
    build: php
    container_name: "ma-php-bench"
    user: ${HOST_UID}:${HOST_GID}
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ../:/var/www/html/
      - ./php/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./certs:/certs:ro
    environment:
      - UID=${HOST_UID}
      - GID=${HOST_GID}
      - USERNAME=${HOST_USERNAME}
      - REDIS_URL=redis://valkey:6379
      - APP_ENV=prod
    depends_on:
      - valkey
    profiles:
      - tools

  # The app with the prod configuration, its own database and Valkey index, for load runs
  php-loadtest:
    build: php
    container_name: "ma-php-loadtest"
    user: ${HOST_UID}:${HOST_GID}
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ../:/var/www/html/
      - ./php/Caddyfile.loadtest:/etc/frankenphp/Caddyfile:ro
      - /dev/null:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro
    environment:
      - UID=${HOST_UID}
      - GID=${HOST_GID}
      - USERNAME=${HOST_USERNAME}
      - APP_ENV=loadtest
      - APP_DEBUG=0
      - DATABASE_URL=mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@${MARIADB_HOST}:3306/meetagain_loadtest?charset=utf8mb4
      - REDIS_URL=redis://valkey:6379/3
      - MOLLIE_WEBHOOK_SECRET=loadtest-webhook-secret-0000000000000000
      - PHP_INI_SCAN_DIR=:/var/www/html/var/loadtest/php
    mem_limit: ${LOADTEST_PHP_MEMORY:-16g}
    memswap_limit: ${LOADTEST_PHP_MEMORY:-16g}
    depends_on:
      - mariadb
      - valkey
      - mailpit
    profiles:
      - loadtest

  # k6 for load and attack runs (attack runs via: just testAttack)
  loadtest:
    image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
    container_name: "ma-loadtest"
    network_mode: "host"
    user: ${HOST_UID}:${HOST_GID}
    volumes:
      - ../tests/loadtest:/scripts:ro
      - ../tests/reports:/reports
    environment:
      - K6_WEB_DASHBOARD=true
    mem_limit: 4g
    memswap_limit: 4g
    profiles:
      - tools

  # Page speed analyzer (run via: just testPerformance)
  sitespeed:
    image: sitespeedio/sitespeed.io:42.8.0@sha256:c0703a6aab4f3a18c8c0ddeec005dc90eeec2f8e2a9a49f773a3bfd2a006dfff
    container_name: "ma-sitespeed"
    network_mode: "host"
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - ../tests/reports/performance:/sitespeed.io
    command: http://localhost:8080/en http://localhost:8080/en/events http://localhost:8080/en/members http://localhost:8080/en/about
    profiles:
      - tools

  # Metrics collector, opt-in (run via: just dockerMetricsStart)
  victoriametrics:
    container_name: "ma-victoriametrics"
    image: victoriametrics/victoria-metrics:v1.154.0@sha256:4bd592341587d669b7f57d54bbb82bd21ac8675f4e24234b7703a7c0f85197d8
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
      - "-influxListenAddr=:8089"
      - "-selfScrapeInterval=30s"
    volumes:
      - ma-victoriametrics-data:/storage
    ports:
      - "127.0.0.1:8428:8428"
    profiles:
      - metrics

  # Metrics dashboards at http://localhost:3001, opt-in (run via: just dockerMetricsStart)
  grafana:
    container_name: "ma-grafana"
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/MeetAgain/meetagain.json
    volumes:
      - ma-grafana-data:/var/lib/grafana
      - ./metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./metrics/grafana/dashboards:/var/lib/grafana/dashboards/MeetAgain:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - victoriametrics
    profiles:
      - metrics

volumes:
  ma-mysql-data:
  ma-caddy_data:
  ma-caddy_config:
  ma-valkey-data:
  ma-garage-meta:
  ma-garage-data:
  ma-victoriametrics-data:
  ma-grafana-data:
