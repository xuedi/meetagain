services:

  # Main PHP application server (FrankenPHP with Caddy)
  php:
    build: php
    container_name: "ma-php"
    user: ${HOST_UID}:${HOST_GID}
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
      - "443:443/udp" # HTTP/3
    volumes:
      - ../:/var/www/html/
      - ./php/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./certs:/certs:ro
      - ma-caddy_data:/data
      - ma-caddy_config:/config
    environment:
      - UID=${HOST_UID}
      - GID=${HOST_GID}
      - USERNAME=${HOST_USERNAME}
      - REDIS_URL=redis://valkey:6379
    depends_on:
      - valkey
    tty: true

  # Database server
  mariadb:
    image: mariadb:12.3.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    container_name: "ma-db"
    volumes:
      - ma-mysql-data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_HOST=${MARIADB_HOST}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}

  # Mail catcher for development (UI at localhost:8025)
  mailpit:
    container_name: "ma-mailpit"
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    user: ${HOST_UID}:${HOST_GID}
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      - MP_MAX_MESSAGES=0

  # Redis-compatible cache server
  valkey:
    container_name: "ma-valkey"
    image: valkey/valkey:9.1@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - ma-valkey-data:/data

  # Accessibility testing tool (run via: just checkA11y)
  pa11y:
    build: pa11y
    container_name: "ma-pa11y"
    network_mode: "host"

  # PHP server in prod mode for benchmarking (run via: just testPerformance)
  php-bench:
    build: php
    container_name: "ma-php-bench"
    user: ${HOST_UID}:${HOST_GID}
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ../:/var/www/html/
      - ./php/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./certs:/certs:ro
    environment:
      - UID=${HOST_UID}
      - GID=${HOST_GID}
      - USERNAME=${HOST_USERNAME}
      - REDIS_URL=redis://valkey:6379
      - APP_ENV=prod
    depends_on:
      - valkey
    profiles:
      - tools

  # Load and attack testing tool (run via: just testLoad / just testAttack)
  loadtest:
    image: grafana/k6:2.2.0@sha256:9bd01d6941fca969cb61bb57d2da5ee9b385fe2aa8881df3798c196564d6ace6
    container_name: "ma-loadtest"
    network_mode: "host"
    user: ${HOST_UID}:${HOST_GID}
    volumes:
      - ../tests/loadtest:/scripts:ro
      - ../tests/reports:/reports
    environment:
      - K6_WEB_DASHBOARD=true
    profiles:
      - tools

  # Page speed analyzer (run via: just testPerformance)
  sitespeed:
    image: sitespeedio/sitespeed.io:42.6.0@sha256:075311541bfd68e299f0ae451c4520bd2ea1e00bc3f5d416514bae8784159b6b
    container_name: "ma-sitespeed"
    network_mode: "host"
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - ../tests/reports/performance:/sitespeed.io
    command: http://localhost:8080/en http://localhost:8080/en/events http://localhost:8080/en/members http://localhost:8080/en/about
    profiles:
      - tools

  # Metrics collector, opt-in (run via: just dockerMetricsStart)
  victoriametrics:
    container_name: "ma-victoriametrics"
    image: victoriametrics/victoria-metrics:v1.152.0@sha256:86ca5fdb6d87d56ba047b044039019ba2bd9042b36e35f6ea34e437b6c825cef
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
      - "-influxListenAddr=:8089"
      - "-selfScrapeInterval=30s"
    volumes:
      - ma-victoriametrics-data:/storage
    ports:
      - "127.0.0.1:8428:8428"
    profiles:
      - metrics

  # Metrics dashboards at http://localhost:3001, opt-in (run via: just dockerMetricsStart)
  grafana:
    container_name: "ma-grafana"
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/MeetAgain/meetagain.json
    volumes:
      - ma-grafana-data:/var/lib/grafana
      - ./metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./metrics/grafana/dashboards:/var/lib/grafana/dashboards/MeetAgain:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - victoriametrics
    profiles:
      - metrics

volumes:
  ma-mysql-data:
  ma-caddy_data:
  ma-caddy_config:
  ma-valkey-data:
  ma-victoriametrics-data:
  ma-grafana-data:
