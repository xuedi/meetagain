name: Bug report
description: Something does not work as expected
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. 1.4.0 or a commit hash
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Anything that helps. Remove passwords, tokens and personal data first.
