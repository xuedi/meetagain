name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "development" ]

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, apcu, intl, redis

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Setup config
        run: |
          cp config/plugins.dist.php config/plugins.php
          cp .env.dist .env
          echo "REDIS_URL=redis://127.0.0.1:6379" >> .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Run unit tests
        run: vendor/bin/phpunit -c tests/config/phpunit.xml --testsuite=default --no-coverage

  archives:
    name: Archive Imports
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=5
      redis:
        image: redis:8@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/meetAgain
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, apcu, pdo_mysql, imagick, intl, opcache, redis

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Setup config
        run: |
          cp config/plugins.dist.php config/plugins.php
          cp .env.dist .env
          echo "DATABASE_URL=${DATABASE_URL}" >> .env
          echo "REDIS_URL=${REDIS_URL}" >> .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      # Each archive gets a fresh database built by the real migrations, only the plugins it
      # names, a strict import, and a whole-instance export whose row counts must match the archive.
      - name: Import every archive and export it again
        run: |
          set -euo pipefail
          for archive in src/DataImportFixtures/*/; do
            echo "::group::${archive}"
            php bin/console app:plugin disable all
            php bin/console app:plugin enable $(php bin/console app:import:inspect "${archive}" --format=plugins)
            php bin/console cache:clear -q
            php bin/console doctrine:database:drop --force --if-exists -q
            php bin/console doctrine:database:create -q
            php bin/console doctrine:migrations:migrate -n -q
            php bin/console app:install:seed -q
            php bin/console app:import "${archive}" --shift-dates --site-settings --strict
            php bin/console app:export /tmp/round-trip.zip
            diff <(php bin/console app:import:inspect "${archive}" | jq -S .counts) <(php bin/console app:import:inspect /tmp/round-trip.zip | jq -S .counts)
            echo "::endgroup::"
          done

  isolation:
    name: Plugin Isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, apcu, intl, redis

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Setup config
        run: |
          cp config/plugins.dist.php config/plugins.php
          cp .env.dist .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Leave-one-out container compile
        run: php bin/check-plugin-isolation.php

  checks:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, apcu, intl

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Setup config
        run: |
          cp config/plugins.dist.php config/plugins.php
          cp .env.dist .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Validate composer
        run: composer validate --strict

      - name: Mago lint
        run: vendor/bin/mago --config tests/config/mago.toml lint

      - name: Mago analyze
        run: vendor/bin/mago --config tests/config/mago.toml analyze

      - name: Mago guard
        run: vendor/bin/mago --config tests/config/mago.toml guard

      - name: GET-route purity check
        run: php bin/check-get-routes.php

      - name: Plugin config check against the shipped test defaults
        run: |
          cp config/plugins_test.dist.php config/plugins_test.php
          php bin/check-plugin-config.php test
