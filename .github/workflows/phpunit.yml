name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "development" ]

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8@sha256:4764ce37931aac77c0d033680b339b19b4a4a81772204d268947cb851212d0ac
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, apcu, intl, redis

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Setup config
        run: |
          cp .env.dist .env
          echo "REDIS_URL=redis://127.0.0.1:6379" >> .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Run unit tests
        run: vendor/bin/phpunit -c tests/config/phpunit.xml --testsuite=default --no-coverage

  modules:
    name: Module Tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:13.0.2@sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=5
      redis:
        image: redis:8@sha256:4764ce37931aac77c0d033680b339b19b4a4a81772204d268947cb851212d0ac
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/meetAgain
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, apcu, pdo_mysql, imagick, intl, opcache, redis

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Setup config
        run: |
          cp .env.dist .env
          echo "DATABASE_URL=${DATABASE_URL}" >> .env
          echo "REDIS_URL=${REDIS_URL}" >> .env

      # Pinned to the version docker/php/Dockerfile bakes into the dev image, so CI and the
      # container compile the same stylesheets.
      - name: Install Sass
        run: |
          npm install -g --ignore-scripts sass@1.86.3
          cp assets/styles/_config.scss.dist assets/styles/_config.scss

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Build assets
        run: php bin/console sass:build

      # Core and the modules only, no plugin, on a schema-only database the script builds.
      - name: Run module tests
        run: |
          tests/bin/module-db.sh --rebuild
          vendor/bin/phpunit -c tests/config/phpunit.modules.xml --no-coverage

  archives:
    name: Archive Imports
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:13.0.2@sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=5
      redis:
        image: redis:8@sha256:4764ce37931aac77c0d033680b339b19b4a4a81772204d268947cb851212d0ac
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/meetAgain
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, apcu, pdo_mysql, imagick, intl, opcache, redis

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Setup config
        run: |
          cp .env.dist .env
          echo "DATABASE_URL=${DATABASE_URL}" >> .env
          echo "REDIS_URL=${REDIS_URL}" >> .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      # Each archive gets a fresh database built by the real migrations, only the plugins it
      # names switched on, a strict import, and a whole-instance export whose row counts must match the archive.
      - name: Import every archive and export it again
        run: |
          set -euo pipefail
          for archive in src/DataImportFixtures/*/; do
            echo "::group::${archive}"
            php bin/console doctrine:database:drop --force --if-exists -q
            php bin/console doctrine:database:create -q
            php bin/console doctrine:migrations:migrate -n -q
            php bin/console app:install:seed -q
            php bin/console app:geo:import all --source=modules/geo/tests/Sample -q
            plugins="$(php bin/console app:import:inspect "${archive}" --format=plugins)"
            if [ -n "${plugins}" ]; then php bin/console app:plugin:toggle on ${plugins}; fi
            php bin/console app:import "${archive}" --shift-dates --site-settings --strict
            php bin/console app:export /tmp/round-trip.zip
            diff <(php bin/console app:import:inspect "${archive}" | jq -S .counts) <(php bin/console app:import:inspect /tmp/round-trip.zip | jq -S .counts)
            echo "::endgroup::"
          done

  isolation:
    name: Plugin Isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, apcu, intl, redis

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Setup config
        run: |
          cp .env.dist .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Leave-one-out container compile
        run: php bin/check-plugin-isolation.php

  checks:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, apcu, intl

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Setup config
        run: |
          cp .env.dist .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Validate composer
        run: composer validate --strict

      - name: Mago lint
        run: vendor/bin/mago --config tests/config/mago.toml lint

      - name: Mago analyze
        run: vendor/bin/mago --config tests/config/mago.toml analyze

      - name: Mago guard
        run: vendor/bin/mago --config tests/config/mago.toml guard

      - name: GET-route purity check
        run: php bin/check-get-routes.php

