[workspace]
resolver = "2"
members = [
    "api",
    "bing",
    "bugsink",
    "comment-guard",
    "docs-guard",
    "gsc",
    "leak-guard",
    "mermaid-guard",
    "toolconfig",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
toolconfig = { path = "toolconfig" }
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
